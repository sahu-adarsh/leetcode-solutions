# Auto-generated by `lp init` — https://github.com/adarshsahu1077/leetpush
name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC — adjust to your timezone
  workflow_dispatch:        # run manually: repo → Actions → Sync LeetCode Solutions → Run workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: sahu-adarsh/leetpush@v1
        with:
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: sahu-adarsh
